<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修仙 · xuxian（暂定名）</title>
  <style>
    /* ===== 纸墨 UI 设计令牌：宣纸、浓墨、朱砂、青玉形成层级 ===== */
    :root {
      --paper: #f6ecd7;
      --paper-bright: #fdf8ea;
      --paper-warm: #eee0c2;
      --ink: #191d1f;
      --ink-soft: #4d5048;
      --ink-muted: #757468;
      --seal: #a03b2c;
      --seal-dark: #7c271e;
      --jade: #35705c;
      --bronze: #8b6739;
      --line: rgba(25, 29, 31, .16);
      --line-strong: rgba(25, 29, 31, .32);
      --shadow-deep: 0 28px 80px rgba(31, 21, 9, .22);
      --serif: "Source Han Serif SC", "Noto Serif CJK SC", "Noto Serif SC", "Songti SC", "SimSun", serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
    body {
      color: var(--ink); font-family: var(--serif);
      background:
        radial-gradient(circle at 18% 8%, rgba(255,251,239,.9), transparent 32%),
        radial-gradient(circle at 82% 90%, rgba(193,166,119,.18), transparent 38%),
        linear-gradient(115deg, #f8f0dd, #f1e5c8 58%, #ecdcc0);
    }
    button, textarea, input { font: inherit; color: inherit; }
    button:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid rgba(160,59,44,.65); outline-offset: 2px; }

    /* 游戏层满幅铺底；DOM 只承载 HUD 与面板 */
    #game-root { position: absolute; inset: 0; }
    #game-root canvas { display: block; margin: 0 auto; }
    #dom-layer { position: absolute; inset: 0; pointer-events: none; }

    /* ===== 面板：宣纸双层框 + 朱砂顶线 ===== */
    .xl-panel {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(910px, calc(100vw - 48px)); max-height: min(660px, calc(100vh - 88px));
      overflow: auto; overscroll-behavior: contain;
      padding: 40px min(46px, 5vw) 34px;
      pointer-events: auto; text-align: center; color: var(--ink);
      background:
        linear-gradient(90deg, rgba(255,255,255,.72), transparent 18%, transparent 82%, rgba(160,126,73,.11)),
        linear-gradient(180deg, #fdf8ea, #f7edd7 68%, #f0e2c5);
      border: 1px solid rgba(64, 45, 24, .34); border-radius: 3px;
      box-shadow: var(--shadow-deep), inset 0 0 0 6px rgba(253,248,234,.72), inset 0 0 34px rgba(176,137,83,.13);
    }
    .xl-panel::before {
      content: ""; position: absolute; inset: 8px; pointer-events: none;
      border: 1px solid rgba(25,29,31,.13); mix-blend-mode: multiply;
    }
    .xl-panel::after {
      content: ""; position: absolute; top: -1px; left: 50%; width: 64px; height: 3px;
      transform: translateX(-50%); background: linear-gradient(90deg, transparent, var(--seal), transparent);
    }
    .xl-panel[data-panel-id="main-menu"] { width: min(480px, calc(100vw - 42px)); }
    .xl-panel[data-panel-id="hub"] { width: min(900px, calc(100vw - 52px)); }
    .xl-panel[data-panel-id="cultivation"] { width: min(940px, calc(100vw - 42px)); }
    .xl-panel[data-panel-id="character"] { width: min(900px, calc(100vw - 42px)); }
    .xl-panel[data-panel-id="echo"] { width: min(540px, calc(100vw - 42px)); }

    /* 主标题与印章式小标 */
    .xl-heading {
      position: relative; display: inline-block; padding-bottom: 12px;
      font-size: clamp(30px, 5vw, 44px); font-weight: 700; letter-spacing: 16px; text-indent: 16px;
    }
    .xl-heading::after {
      content: ""; position: absolute; left: 50%; bottom: 0; width: 54px; height: 1px;
      transform: translateX(-50%); background: linear-gradient(90deg, transparent, var(--seal), transparent);
    }
    .xl-heading--sm { font-size: 24px; letter-spacing: 9px; text-indent: 9px; padding-bottom: 8px; }
    .xl-kicker {
      display: inline-flex; align-items: center; gap: 8px;
      color: var(--seal); font-size: 12px; letter-spacing: 5px;
    }
    .xl-kicker::before, .xl-kicker::after { content: ""; width: 18px; height: 1px; background: currentColor; opacity: .5; }
    .xl-sub { max-width: 560px; margin: 16px auto 0; color: var(--ink-soft); font-size: 13px; line-height: 1.8; letter-spacing: 1px; }
    .xl-sub--left { margin-left: 0; text-align: left; }

    /* ===== 按钮：墨面 / 纸面 / 朱砂三态语义 ===== */
    .xl-btn {
      position: relative; display: inline-flex; align-items: center; justify-content: center;
      width: 100%; min-height: 46px; margin: 10px 0 0; padding: 12px 22px; overflow: hidden;
      font-size: 16px; font-weight: 600; letter-spacing: 5px; text-indent: 5px; white-space: nowrap;
      color: #f9f2e2; cursor: pointer;
      background: linear-gradient(145deg, #2b3235, #16191a 56%, #24292a);
      border: 1px solid #121516; border-radius: 2px;
      box-shadow: 0 9px 20px rgba(29,22,11,.17), inset 0 1px 0 rgba(255,255,255,.13);
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }
    .xl-btn::before { content: ""; position: absolute; inset: 3px; border: 1px solid rgba(249,242,226,.22); pointer-events: none; }
    .xl-btn:hover:not(:disabled), .xl-btn:focus-visible {
      filter: brightness(1.14); transform: translateY(-1px);
      box-shadow: 0 13px 26px rgba(82,26,15,.18), inset 0 1px 0 rgba(255,255,255,.16);
    }
    .xl-btn:active:not(:disabled) { transform: translateY(0); filter: brightness(.96); }
    .xl-btn:disabled { cursor: not-allowed; opacity: .34; filter: grayscale(.35); box-shadow: none; transform: none; }
    .xl-btn--ghost {
      color: var(--ink); background: rgba(253,248,234,.4); border-color: var(--line-strong);
      box-shadow: inset 0 0 18px rgba(184,145,89,.08);
    }
    .xl-btn--ghost::before { border-color: rgba(25,29,31,.09); }
    .xl-btn--ghost:hover:not(:disabled), .xl-btn--ghost:focus-visible {
      color: var(--seal-dark); background: rgba(160,59,44,.08); border-color: rgba(160,59,44,.52); filter: none;
    }
    .xl-btn--seal { background: linear-gradient(145deg, #b14532, #822c20 62%, #93372a); border-color: #6d2118; }
    .xl-btn--compact { width: auto; min-height: 40px; min-width: 116px; font-size: 14px; letter-spacing: 3px; text-indent: 3px; }

    /* Toast：墨简横陈 */
    .xl-toast {
      position: absolute; left: 50%; bottom: 8%; z-index: 20; transform: translate(-50%, 12px);
      pointer-events: none; min-width: 220px; max-width: min(540px, 86vw); text-align: center;
      padding: 13px 26px; color: #f6eddc; font-size: 14px; letter-spacing: 2px; line-height: 1.5;
      background: linear-gradient(120deg, rgba(21,25,25,.95), rgba(43,38,32,.94));
      border: 1px solid rgba(230,205,160,.24); border-radius: 2px;
      box-shadow: 0 16px 36px rgba(16,10,4,.24); opacity: 0;
      transition: opacity .25s ease, transform .25s ease; white-space: nowrap;
    }
    .xl-toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ===== 表单与信息片 ===== */
    .xl-step-tag { display: flex; justify-content: center; margin-bottom: 18px; }
    .xl-heading--sm + .xl-hint { margin-top: 14px; }
    .xl-hint { color: var(--ink-soft); font-size: 14px; line-height: 1.8; letter-spacing: 1px; margin: 10px 0 18px; }
    .xl-textarea {
      width: 100%; min-height: 116px; padding: 18px 18px 12px; resize: none;
      color: var(--ink); font-size: 16px; line-height: 1.85; letter-spacing: 1px;
      background: repeating-linear-gradient(180deg, rgba(253,248,234,.88) 0 31px, rgba(122,89,49,.13) 31px 32px);
      border: 1px solid var(--line-strong); border-radius: 2px;
      box-shadow: inset 0 0 20px rgba(154,112,55,.08);
    }
    .xl-textarea::placeholder { color: rgba(88,82,70,.52); }
    .xl-counter { margin: 8px 0 18px; text-align: right; color: var(--ink-muted); font-size: 12px; letter-spacing: 2px; }
    .xl-sheet {
      position: relative; padding: 20px 22px 22px; text-align: left;
      background: linear-gradient(160deg, rgba(253,248,234,.86), rgba(243,231,205,.72));
      border: 1px solid var(--line); border-radius: 2px;
      box-shadow: 0 10px 28px rgba(78,55,26,.07), inset 0 0 22px rgba(198,158,98,.07);
    }
    .xl-sheet::before { content: ""; position: absolute; top: 0; left: 0; width: 34px; height: 2px; background: var(--bronze); opacity: .58; }
    .xl-sheet--quiet { background: rgba(253,248,234,.52); box-shadow: none; }
    .xl-sheet-title {
      display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
      padding-bottom: 10px; margin-bottom: 15px; font-size: 18px; font-weight: 700; letter-spacing: 4px;
      border-bottom: 1px solid rgba(25,29,31,.12);
    }
    .xl-row { display: block; margin: 9px 0; color: var(--ink); font-size: 15px; line-height: 1.7; }
    .xl-label { display: inline-block; min-width: 3.4em; margin-right: 8px; color: var(--ink-muted); font-size: 13px; letter-spacing: 1px; }
    .xl-sub-inline { color: var(--ink-muted); font-size: 12px; letter-spacing: .5px; }
    .xl-story {
      position: relative; margin: 16px 0; padding: 16px 18px 14px 22px; overflow: hidden;
      color: #363026; font-size: 14px; line-height: 2; text-align: justify;
      background: linear-gradient(100deg, rgba(224,202,156,.34), rgba(253,248,234,.58));
      border: 1px solid rgba(148,115,68,.2); border-left: 3px solid var(--bronze); border-radius: 2px;
    }
    .xl-comment { margin: 12px 0 0; color: var(--ink-muted); font-size: 13px; font-style: italic; line-height: 1.8; }
    .xl-name-input {
      width: min(220px, 100%); padding: 6px 2px; color: var(--ink); font-size: 18px; letter-spacing: 2px;
      background: transparent; border: 0; border-bottom: 1px dashed var(--line-strong);
    }
    .xl-name-input:focus { border-bottom-color: var(--seal); }

    /* 命格卡：可点选的纸签 */
    .xl-forge-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 18px; align-items: start; text-align: left; }
    .xl-fates-title { margin-bottom: 12px; color: var(--ink); font-size: 15px; font-weight: 700; letter-spacing: 2px; }
    .xl-fate-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .xl-fate-card {
      position: relative; padding: 13px 13px 12px 16px; cursor: pointer; text-align: left;
      background: rgba(253,248,234,.62); border: 1px solid var(--line); border-radius: 2px;
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease, background .16s ease;
    }
    .xl-fate-card::before { content: ""; position: absolute; top: 8px; bottom: 8px; left: 0; width: 3px; background: var(--card-mark, var(--ink-muted)); opacity: .72; }
    .xl-fate-card:hover { transform: translateY(-1px); background: rgba(253,248,234,.9); box-shadow: 0 8px 20px rgba(69,48,22,.1); }
    .xl-fate-card.tier-fan { --card-mark: #848a7d; }
    .xl-fate-card.tier-ling { --card-mark: var(--jade); }
    .xl-fate-card.tier-tian { --card-mark: var(--seal); }
    .xl-fate-card.picked {
      background: rgba(160,59,44,.075); border-color: rgba(160,59,44,.62);
      box-shadow: 0 8px 22px rgba(124,39,30,.12);
    }
    .xl-fate-card.picked::after {
      content: "已择"; position: absolute; top: 9px; right: 9px; padding: 2px 6px;
      color: var(--seal); font-size: 10px; letter-spacing: 2px; border: 1px solid currentColor;
    }
    .xl-fate-name { color: var(--ink); font-size: 15px; font-weight: 700; }
    .xl-fate-tier { margin-left: 7px; color: var(--ink-muted); font-size: 11px; font-weight: 400; }
    .xl-fate-effect { margin: 6px 0 5px; color: var(--seal-dark); font-size: 13px; line-height: 1.55; }
    .xl-fate-flavor { color: var(--ink-muted); font-size: 12px; line-height: 1.6; }

    /* ===== HUD：气韵状态带 ===== */
    .xl-statusbar {
      position: absolute; top: 0; left: 0; right: 0; z-index: 8;
      display: flex; align-items: center; gap: 10px; min-height: 58px;
      padding: 9px 26px; pointer-events: none;
      color: var(--ink); font-size: 13px; letter-spacing: 1px;
      background: linear-gradient(90deg, rgba(253,248,234,.97), rgba(244,232,206,.9) 72%, rgba(238,221,188,.78));
      border-bottom: 1px solid rgba(64,45,24,.22);
      box-shadow: 0 12px 28px rgba(76,53,23,.09);
    }
    .xl-statusbar::after {
      content: ""; position: absolute; left: 0; right: 0; bottom: -4px; height: 4px;
      background: linear-gradient(90deg, rgba(139,103,57,.16), transparent 30%, rgba(160,59,44,.12) 82%, transparent);
    }
    .xl-sb-name {
      position: relative; display: inline-flex; align-items: center; min-height: 34px; padding: 0 15px;
      font-size: 17px; font-weight: 700; letter-spacing: 4px;
      background: linear-gradient(145deg, #292f31, #171a19); color: #f7efdd;
      box-shadow: 0 7px 16px rgba(26,20,9,.14); border-radius: 2px;
    }
    .xl-sb-name::after { content: ""; position: absolute; right: 4px; bottom: 4px; width: 5px; height: 5px; background: var(--seal); }
    .xl-sb-item {
      display: inline-flex; align-items: center; gap: 7px; min-height: 31px; padding: 0 12px;
      background: rgba(253,248,234,.42); border: 1px solid rgba(25,29,31,.09); border-radius: 2px;
    }
    .xl-sb-item > span { color: var(--ink-muted); }
    .xl-sb-item b { color: #7f2c20; font-weight: 700; letter-spacing: 0; }
    .xl-sb-wide { min-width: 220px; }
    .xl-sb-cult { display: inline-flex; align-items: center; gap: 7px; margin-left: auto; min-height: 31px; padding: 0 12px; font-size: 12px; letter-spacing: 2px; border: 1px solid transparent; }
    .xl-sb-cult.on {
      color: var(--seal-dark); background: rgba(160,59,44,.09); border-color: rgba(160,59,44,.3);
      animation: xlBreath 2.4s ease-in-out infinite;
    }
    .xl-sb-cult.off { color: var(--ink-muted); background: rgba(253,248,234,.35); border-color: var(--line); }
    @keyframes xlBreath { 0%,100% { opacity: 1; } 50% { opacity: .58; } }

    /* 进度条：朱砂内嵌于浅墨槽 */
    .xl-bar {
      position: relative; display: inline-block; width: 96px; height: 7px; overflow: hidden;
      margin-left: 9px; vertical-align: middle; background: rgba(25,29,31,.11);
      border: 1px solid rgba(25,29,31,.18); border-radius: 8px;
      box-shadow: inset 0 1px 2px rgba(43,29,11,.14);
    }
    .xl-bar i {
      display: block; height: 100%; border-radius: 8px;
      background: linear-gradient(90deg, #d05f41, #95301f 72%, #b0472f);
      box-shadow: 0 0 8px rgba(160,59,44,.4); transition: width .3s ease;
    }
    .xl-bar-wide { width: 150px; }

    /* ===== 洞府首屏：入口以纸签排列 ===== */
    .xl-hub-head { margin-top: 4px; }
    .xl-hub-grid { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 12px; margin-top: 30px; }
    .xl-hub-entry {
      position: relative; display: flex; flex-direction: column; justify-content: space-between;
      min-height: 148px; padding: 24px 12px 18px; overflow: hidden; cursor: pointer; text-align: center;
      background: linear-gradient(180deg, rgba(253,248,234,.88), rgba(239,225,196,.64));
      border: 1px solid rgba(87,62,30,.24); border-radius: 2px;
      box-shadow: 0 9px 22px rgba(77,55,26,.08);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background .18s ease;
    }
    .xl-hub-entry::before {
      content: attr(data-num); position: absolute; top: 8px; right: 10px;
      color: rgba(160,59,44,.38); font-size: 10px; letter-spacing: 2px;
    }
    .xl-hub-entry::after {
      content: ""; position: absolute; left: 50%; bottom: 10px; width: 22px; height: 1px;
      transform: translateX(-50%); background: currentColor; opacity: .22;
      transition: width .18s ease, opacity .18s ease;
    }
    .xl-hub-entry:hover:not(.dis) {
      transform: translateY(-4px); border-color: rgba(160,59,44,.58);
      background: linear-gradient(180deg, rgba(255,252,243,.98), rgba(242,224,189,.82));
      box-shadow: 0 18px 35px rgba(124,39,30,.14);
    }
    .xl-hub-entry:hover:not(.dis)::after { width: 44px; opacity: .62; }
    .xl-hub-entry.dis { cursor: not-allowed; color: rgba(25,29,31,.39); background: rgba(244,233,208,.44); box-shadow: none; }
    .xl-hub-label { display: block; font-size: 20px; font-weight: 700; letter-spacing: 6px; text-indent: 6px; }
    .xl-hub-sub { display: block; margin: 11px 0 12px; color: var(--ink-muted); font-size: 11px; line-height: 1.5; letter-spacing: 1px; }
    .xl-hub-entry.dis .xl-hub-sub { color: rgba(90,84,74,.75); }
    .xl-hub-state {
      position: relative; z-index: 1; align-self: center; padding: 3px 8px;
      color: var(--bronze); font-size: 10px; letter-spacing: 3px; border: 1px solid rgba(139,103,57,.34);
    }
    .xl-hub-entry:not(.dis) .xl-hub-state { color: var(--jade); border-color: rgba(53,112,92,.35); }

    /* ===== 修炼室：闭关 / 突破 / 待务 ===== */
    .xl-cult-grid { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 14px; align-items: stretch; text-align: left; }
    .xl-cult-status {
      display: inline-flex; align-items: center; gap: 8px; min-height: 33px; padding: 0 11px; margin-bottom: 14px;
      font-size: 14px; letter-spacing: 1px; border-radius: 2px;
    }
    .xl-cult-status.on { color: var(--seal-dark); background: rgba(160,59,44,.08); border: 1px solid rgba(160,59,44,.26); }
    .xl-cult-status.off { color: var(--ink-soft); background: rgba(253,248,234,.58); border: 1px solid var(--line); }
    .xl-rates { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; margin: 0 0 15px; }
    .xl-rates span {
      display: flex; align-items: center; justify-content: space-between; min-height: 35px; padding: 0 10px;
      color: var(--ink-muted); font-size: 12px; background: rgba(253,248,234,.58); border: 1px solid rgba(25,29,31,.08);
    }
    .xl-rates b { color: var(--ink); font-size: 14px; }
    .xl-warn {
      display: flex; align-items: center; gap: 8px; padding: 9px 11px; margin: 10px 0;
      color: var(--seal-dark); font-size: 12px; line-height: 1.55; letter-spacing: 1px;
      background: rgba(160,59,44,.07); border: 1px solid rgba(160,59,44,.24); border-left: 3px solid var(--seal);
    }
    .xl-break-list { display: grid; gap: 9px; margin-bottom: 15px; }
    .xl-stage {
      position: relative; padding: 13px 15px 12px; cursor: pointer; overflow: hidden;
      background: rgba(253,248,234,.62); border: 1px solid var(--line); border-radius: 2px;
      transition: border-color .15s ease, background .15s ease, transform .15s ease, box-shadow .15s ease;
    }
    .xl-stage::before { content: ""; position: absolute; top: 0; left: 0; width: 3px; height: 100%; background: var(--stage-mark, var(--bronze)); opacity: .62; }
    .xl-stage:nth-child(1) { --stage-mark: var(--seal); }
    .xl-stage:nth-child(2) { --stage-mark: var(--bronze); }
    .xl-stage:nth-child(3) { --stage-mark: var(--jade); }
    .xl-stage:hover:not(.dis) { transform: translateX(2px); background: rgba(253,248,234,.92); border-color: rgba(139,103,57,.46); box-shadow: 0 8px 20px rgba(80,57,25,.09); }
    .xl-stage.dis { cursor: not-allowed; opacity: .46; }
    .xl-stage-name { color: var(--ink); font-size: 16px; font-weight: 700; letter-spacing: 2px; }
    .xl-stage-desc { margin: 5px 0 9px; color: var(--ink-muted); font-size: 12px; line-height: 1.55; }
    .xl-stage-rate { color: var(--ink-muted); font-size: 12px; letter-spacing: 1px; }
    .xl-stage-rate b { color: var(--seal-dark); font-size: 16px; }
    .xl-confirm, .xl-result {
      position: relative; padding: 15px 16px; margin-top: 12px; text-align: left;
      background: rgba(253,248,234,.72); border: 1px solid rgba(160,59,44,.4); border-left: 3px solid var(--seal);
      box-shadow: 0 8px 22px rgba(124,39,30,.08);
    }
    .xl-confirm-title, .xl-result-title { margin-bottom: 8px; color: var(--ink); font-size: 16px; font-weight: 700; letter-spacing: 1px; }
    .xl-result.ok { border-color: rgba(53,112,92,.5); border-left-color: var(--jade); background: rgba(53,112,92,.07); }
    .xl-result.fail { border-color: rgba(25,29,31,.28); border-left-color: var(--ink-soft); background: rgba(25,29,31,.045); }
    .xl-result-line { margin-bottom: 8px; color: var(--ink); font-size: 14px; line-height: 1.7; }
    .xl-formula { color: var(--ink-soft); font-size: 13px; line-height: 1.9; }
    .xl-formula b { color: var(--seal-dark); font-size: 16px; }
    .xl-narration { margin: 10px 0; color: #3c372e; font-size: 14px; line-height: 2.1; text-align: justify; }
    .xl-btn-row { display: flex; gap: 9px; margin-top: 10px; }
    .xl-btn-row .xl-btn { flex: 1; }

    /* 属性分配：数据行化，弱化裸按钮方块 */
    .xl-alloc { margin: 4px 0 6px; }
    .xl-alloc-row {
      display: grid; grid-template-columns: 52px minmax(0,1fr) 68px 33px 33px; align-items: center; gap: 9px;
      min-height: 44px; padding: 0 9px; margin: 7px 0; font-size: 14px;
      background: rgba(253,248,234,.48); border: 1px solid rgba(25,29,31,.09); border-radius: 2px;
    }
    .xl-alloc-row .xl-label { min-width: 0; margin: 0; }
    .xl-alloc-v { min-width: 0; color: var(--ink); font-weight: 700; text-align: right; }
    .xl-alloc-btn {
      width: 31px; height: 31px; padding: 0; cursor: pointer; line-height: 1;
      color: var(--ink-soft); background: rgba(253,248,234,.82);
      border: 1px solid var(--line-strong); border-radius: 2px;
      transition: color .15s ease, border-color .15s ease, background .15s ease;
    }
    .xl-alloc-btn:hover:not(:disabled) { color: var(--seal-dark); border-color: rgba(160,59,44,.52); background: rgba(160,59,44,.07); }
    .xl-alloc-btn:disabled { cursor: not-allowed; opacity: .3; }

    /* ===== 道身：卷轴式角色档案 ===== */
    .xl-char-grid { display: grid; grid-template-columns: minmax(0,1.08fr) minmax(0,.92fr); gap: 24px; align-items: start; text-align: left; }
    .xl-char-name {
      display: flex; align-items: baseline; gap: 13px; margin: 7px 0 8px;
      font-size: clamp(27px, 4vw, 34px); font-weight: 700; letter-spacing: 7px; line-height: 1;
    }
    .xl-char-name::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(25,29,31,.24), transparent); }
    .xl-attr-row { display: grid; grid-template-columns: 52px minmax(0,1fr) 34px; align-items: center; gap: 10px; margin: 9px 0; font-size: 13px; }
    .xl-attr-row .xl-label { min-width: 0; margin: 0; }
    .xl-attr-row b { color: var(--ink); font-size: 15px; text-align: right; }
    .xl-derive { padding: 13px 14px; color: var(--ink-soft); font-size: 13px; line-height: 2; background: rgba(253,248,234,.5); border: 1px solid rgba(25,29,31,.09); }
    .xl-fate-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 2px; }
    .xl-fate-chip {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
      color: var(--ink-soft); font-size: 13px; background: rgba(253,248,234,.62);
      border: 1px solid var(--line-strong); border-radius: 2px; box-shadow: 0 4px 10px rgba(74,53,25,.05);
    }
    .xl-fate-chip i { color: var(--ink-muted); font-size: 11px; font-style: normal; }
    .xl-fate-chip.tier-天 { color: var(--seal-dark); border-color: rgba(160,59,44,.46); background: rgba(160,59,44,.06); }
    .xl-fate-chip.tier-灵 { color: #2c5b4a; border-color: rgba(53,112,92,.38); background: rgba(53,112,92,.05); }

    /* ===== M4：要事卡/占卜角标/装备位/物品栏/骰子 ===== */
    .xl-quest-card {
      text-align: left; border: 1px solid var(--line-strong); border-left: 3px solid var(--seal-dark);
      background: rgba(160,59,44,.04); padding: 10px 14px; margin-top: 12px;
    }
    .xl-quest-title { font-size: 12px; color: var(--seal-dark); letter-spacing: 2px; }
    .xl-quest-name { font-size: 17px; font-weight: bold; letter-spacing: 2px; margin: 3px 0; }
    .xl-quest-desc { font-size: 13px; color: var(--ink-soft); }
    .xl-div-badge {
      font-family: inherit; font-size: 13px; cursor: pointer; margin-left: 12px;
      padding: 4px 10px; background: var(--paper); border: 1px solid var(--seal-dark); color: var(--seal-dark);
      vertical-align: middle;
    }
    .xl-div-badge.done { border-color: var(--line); color: var(--ink-muted); cursor: default; }
    .xl-equip-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .xl-equip-slot { border: 1px solid var(--line); padding: 8px 10px; text-align: left; background: rgba(255,255,255,.4); }
    .xl-equip-slot.empty { opacity: .55; }
    .xl-equip-slot-name { font-size: 11px; color: var(--ink-muted); letter-spacing: 2px; }
    .xl-equip-item { font-size: 14px; margin: 4px 0; }
    .xl-equip-bonus { font-size: 12px; color: var(--seal-dark); margin-bottom: 4px; }
    .xl-inv-list { max-height: 220px; overflow-y: auto; text-align: left; }
    .xl-inv-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border: 1px solid var(--line); padding: 8px 12px; margin: 6px 0; background: rgba(255,255,255,.4);
    }
    .xl-inv-main { font-size: 14px; }
    .xl-dice-row { display: flex; gap: 12px; justify-content: center; align-items: center; font-size: 20px; }
    .xl-dice {
      display: inline-flex; width: 44px; height: 44px; align-items: center; justify-content: center;
      border: 1px solid var(--line-strong); background: var(--paper); font-size: 20px; font-weight: bold;
    }
    .xl-div-dirs { display: flex; gap: 8px; justify-content: center; margin: 10px 0; }
    .xl-hex-name { font-size: 22px; letter-spacing: 4px; font-weight: bold; margin-bottom: 4px; }
    .xl-hex-poem { font-size: 14px; color: var(--ink-soft); letter-spacing: 1px; margin-bottom: 8px; }
    .xl-hex-reading { font-size: 14px; line-height: 2; }

    /* ===== M3：战斗（指令条/战报/结算）与灵兽袋 ===== */
    .xl-battlebar { text-align: center; }
    .xl-cmd-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
    .xl-cmd {
      font-family: inherit; font-size: 15px; letter-spacing: 3px; cursor: pointer;
      padding: 10px 16px; min-width: 74px;
      color: var(--ink); background: var(--paper); border: 1px solid var(--line-strong);
      transition: border-color .12s, background .12s, color .12s;
    }
    .xl-cmd:hover:not(:disabled) { border-color: var(--seal-dark); color: var(--seal-dark); }
    .xl-cmd:disabled { opacity: .35; cursor: not-allowed; }
    .xl-cmd.sel { background: var(--ink); color: var(--paper); border-color: var(--ink); }
    .xl-cmd-auto.on { background: var(--seal-dark); color: var(--paper); border-color: var(--seal-dark); }
    .xl-target-row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
    .xl-target {
      font-family: inherit; font-size: 13px; cursor: pointer; padding: 6px 12px;
      color: var(--ink); background: var(--paper); border: 1px solid var(--line);
    }
    .xl-target:hover { border-color: var(--seal-dark); }
    .xl-target.sel { border-color: var(--seal-dark); color: var(--seal-dark); background: rgba(160,59,44,.06); }
    .xl-target i { font-style: normal; color: var(--ink-muted); font-size: 11px; margin-left: 4px; }

    .xl-battlelog {
      position: absolute; right: 14px; bottom: 14px; width: 300px; max-height: 260px;
      pointer-events: auto; text-align: left;
      background: rgba(253,248,234,.9); border: 1px solid var(--line-strong);
      padding: 10px 12px; box-shadow: 0 4px 12px rgba(74,53,25,.08);
    }
    .xl-battlelog-title { font-size: 13px; letter-spacing: 4px; color: var(--ink-soft);
      border-bottom: 1px solid var(--line); padding-bottom: 5px; margin-bottom: 6px; }
    .xl-battlelog-lines { max-height: 190px; overflow-y: auto; }
    .xl-battlelog-line { font-size: 12.5px; line-height: 1.8; color: var(--ink-soft); }

    .xl-beast-list { margin-top: 10px; text-align: left; max-height: 300px; overflow-y: auto; }
    .xl-beast-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      border: 1px solid var(--line); padding: 9px 12px; margin: 7px 0; background: rgba(255,255,255,.4);
    }
    .xl-beast-row.idle { opacity: .62; }
    .xl-beast-main { font-size: 15px; }
    .xl-beast-tag {
      display: inline-block; font-size: 11px; padding: 1px 8px; margin-left: 8px;
      border: 1px solid var(--line-strong); color: var(--ink-soft);
    }
    .xl-beast-tag.starter { color: var(--seal-dark); border-color: rgba(160,59,44,.46); }
    .xl-beast-tag.party { color: #2c5b4a; border-color: rgba(53,112,92,.38); }
    .xl-beast-acts { display: flex; gap: 6px; }

    /* 滚动条与响应式 */
    .xl-panel::-webkit-scrollbar { width: 8px; }
    .xl-panel::-webkit-scrollbar-thumb { background: rgba(114,84,45,.28); border-radius: 8px; }
    .xl-panel::-webkit-scrollbar-track { background: transparent; }
    @media (max-width: 880px) {
      .xl-panel { max-height: calc(100vh - 42px); padding: 32px 22px 26px; }
      .xl-forge-grid, .xl-cult-grid, .xl-char-grid { grid-template-columns: 1fr; }
      .xl-fate-grid { grid-template-columns: 1fr; }
      .xl-hub-grid { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .xl-statusbar { flex-wrap: wrap; gap: 6px; padding: 10px 14px 12px; }
      .xl-sb-cult { margin-left: 0; }
      .xl-alloc-row { grid-template-columns: 45px minmax(0,1fr) 64px 31px 31px; }
    }
    @media (max-width: 520px) {
      .xl-panel { width: calc(100vw - 20px); padding: 28px 15px 22px; }
      .xl-hub-grid, .xl-rates { grid-template-columns: 1fr; }
      .xl-heading { letter-spacing: 9px; text-indent: 9px; }
      .xl-btn-row { flex-direction: column; }
      .xl-statusbar { max-height: 136px; overflow: auto; }
    }
  </style>
