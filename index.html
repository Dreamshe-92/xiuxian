<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>修仙 · xuxian（暂定名）</title>
  <style>
    /* ===== 全局：纸墨风基调 ===== */
    :root {
      --paper: #f8f3e6;        /* 宣纸底 */
      --ink: #1f2933;          /* 墨色 */
      --ink-light: #5b6670;
      --crimson: #9e2b25;      /* 印章红（按钮/强调） */
      --paper-dark: #efe6d0;
      --border: rgba(31, 41, 51, 0.25);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--paper); }
    body { font-family: "Noto Serif SC", "Songti SC", "SimSun", serif; color: var(--ink); }

    /* ===== 游戏层与 DOM 覆盖层 ===== */
    #game-root { position: absolute; inset: 0; }
    #game-root canvas { display: block; margin: 0 auto; }
    #dom-layer { position: absolute; inset: 0; pointer-events: none; } /* 面板自身再开 pointer-events */

    /* ===== DOM 面板通用样式（DomLayer 基建的一部分） ===== */
    .xl-panel {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      pointer-events: auto;
      background: var(--paper);
      border: 1px solid var(--border);
      box-shadow: 0 6px 24px rgba(31, 41, 51, 0.18);
      padding: 28px 36px;
      min-width: 320px;
      text-align: center;
    }
    .xl-btn {
      display: block; width: 100%; margin: 10px 0; padding: 12px 18px;
      font-family: inherit; font-size: 17px; letter-spacing: 4px;
      color: var(--paper); background: var(--ink);
      border: 1px solid var(--ink); cursor: pointer;
      transition: background .15s, color .15s;
    }
    .xl-btn:hover:not(:disabled) { background: var(--crimson); border-color: var(--crimson); }
    .xl-btn:disabled { opacity: .35; cursor: not-allowed; }
    .xl-sub { font-size: 13px; color: var(--ink-light); margin-top: 14px; letter-spacing: 2px; }

    /* ===== Toast 提示 ===== */
    .xl-toast {
      position: absolute; left: 50%; bottom: 12%; transform: translateX(-50%);
      pointer-events: none;
      background: rgba(31, 41, 51, 0.88); color: var(--paper);
      padding: 10px 22px; font-size: 15px; letter-spacing: 2px;
      border-radius: 2px; opacity: 0; transition: opacity .25s;
      white-space: nowrap;
    }
    .xl-toast.show { opacity: 1; }

    /* ===== 凝气篇（创建面板） ===== */
    .xl-panel { max-width: min(860px, 92vw); }
    .xl-step-tag { font-size: 13px; color: var(--crimson); letter-spacing: 4px; margin-bottom: 8px; }
    .xl-hint { font-size: 14px; color: var(--ink-light); margin: 10px 0 12px; letter-spacing: 1px; }
    .xl-textarea {
      width: 100%; padding: 12px; font-family: inherit; font-size: 16px; line-height: 1.7;
      background: var(--paper-dark); color: var(--ink); border: 1px solid var(--border);
      resize: none; letter-spacing: 1px;
    }
    .xl-textarea:focus { outline: none; border-color: var(--crimson); }
    .xl-counter { text-align: right; font-size: 12px; color: var(--ink-light); margin: 4px 0 8px; }

    .xl-forge-grid { display: flex; gap: 18px; text-align: left; }
    .xl-forge-grid .xl-sheet { flex: 1.2; min-width: 0; }
    .xl-forge-grid .xl-fates { flex: 1; min-width: 0; }
    .xl-sheet { border: 1px solid var(--border); padding: 14px 16px; background: rgba(255,255,255,.35); }
    .xl-row { font-size: 15px; margin: 7px 0; line-height: 1.6; }
    .xl-label { display: inline-block; min-width: 3.2em; color: var(--ink-light); font-size: 13px; }
    .xl-sub-inline { font-size: 12px; color: var(--ink-light); margin-left: 6px; }
    .xl-story { font-size: 14px; line-height: 1.9; color: var(--ink); margin: 10px 0; padding: 10px 12px;
      background: var(--paper-dark); border-left: 3px solid var(--border); }
    .xl-comment { font-size: 13px; color: var(--ink-light); font-style: italic; margin: 10px 0; line-height: 1.8; }
    .xl-name-input {
      font-family: inherit; font-size: 16px; color: var(--ink);
      background: transparent; border: none; border-bottom: 1px dashed var(--border);
      padding: 2px 4px; width: 9em;
    }
    .xl-name-input:focus { outline: none; border-bottom-color: var(--crimson); }

    .xl-fates-title { font-size: 15px; letter-spacing: 2px; margin-bottom: 10px; }
    .xl-fate-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .xl-fate-card {
      border: 1px solid var(--border); padding: 9px 11px; cursor: pointer; background: rgba(255,255,255,.4);
      transition: border-color .12s, background .12s;
    }
    .xl-fate-card:hover { background: var(--paper-dark); }
    .xl-fate-card.tier-fan { border-left: 3px solid #8a929b; }
    .xl-fate-card.tier-ling { border-left: 3px solid var(--ink); }
    .xl-fate-card.tier-tian { border-left: 3px solid var(--crimson); }
    .xl-fate-card.picked { border-color: var(--crimson); background: rgba(158, 43, 37, 0.08); }
    .xl-fate-name { font-size: 15px; font-weight: bold; }
    .xl-fate-tier { font-size: 11px; color: var(--ink-light); margin-left: 6px; font-weight: normal; }
    .xl-fate-effect { font-size: 13px; color: var(--crimson); margin: 4px 0 2px; }
    .xl-fate-flavor { font-size: 12px; color: var(--ink-light); line-height: 1.5; }
    .xl-btn-ghost { background: transparent; color: var(--ink); }
    .xl-btn-ghost:hover:not(:disabled) { background: var(--paper-dark); color: var(--ink); border-color: var(--ink); }

    /* ===== M2：顶栏状态条 ===== */
    .xl-statusbar {
      position: absolute; top: 0; left: 0; right: 0;
      pointer-events: none;
      display: flex; align-items: center; gap: 18px;
      padding: 10px 22px; font-size: 14px;
      background: linear-gradient(rgba(248,243,230,.95), rgba(248,243,230,.75));
      border-bottom: 1px solid var(--border); letter-spacing: 1px;
    }
    .xl-sb-name { font-size: 17px; font-weight: bold; letter-spacing: 3px; }
    .xl-sb-item b { color: var(--crimson); font-weight: normal; }
    .xl-sb-wide { min-width: 220px; }
    .xl-sb-cult { margin-left: auto; font-size: 13px; }
    .xl-sb-cult.on { color: var(--crimson); animation: xlPulse 2s infinite; }
    .xl-sb-cult.off { color: var(--ink-light); }
    @keyframes xlPulse { 0%,100%{opacity:1} 50%{opacity:.45} }

    /* 进度条 */
    .xl-bar { display: inline-block; width: 90px; height: 6px; margin-left: 8px;
      background: var(--paper-dark); border: 1px solid var(--border); vertical-align: middle; }
    .xl-bar i { display: block; height: 100%; background: var(--crimson); transition: width .3s; }
    .xl-bar-wide { width: 140px; }

    /* ===== M2：洞府入口 ===== */
    .xl-hub-head { font-size: 30px; letter-spacing: 14px; margin: 4px 0 6px; }
    .xl-hub-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 16px; }
    .xl-hub-entry {
      border: 1px solid var(--border); padding: 18px 8px 14px; cursor: pointer;
      background: rgba(255,255,255,.45); transition: border-color .15s, background .15s;
    }
    .xl-hub-entry:hover { border-color: var(--crimson); background: var(--paper-dark); }
    .xl-hub-entry.dis { opacity: .38; cursor: not-allowed; }
    .xl-hub-label { font-size: 19px; letter-spacing: 4px; }
    .xl-hub-sub { font-size: 12px; color: var(--ink-light); margin-top: 6px; letter-spacing: 2px; }

    /* ===== M2：修炼室 ===== */
    .xl-cult-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; text-align: left; }
    .xl-sheet-title { font-size: 17px; letter-spacing: 4px; border-bottom: 1px solid var(--border); padding-bottom: 6px; margin-bottom: 10px; }
    .xl-cult-status { font-size: 15px; letter-spacing: 2px; margin-bottom: 8px; }
    .xl-cult-status.on { color: var(--crimson); }
    .xl-cult-status.off { color: var(--ink-light); }
    .xl-rates { font-size: 13px; color: var(--ink-light); display: flex; flex-wrap: wrap; gap: 6px 14px; margin-bottom: 8px; }
    .xl-rates b { color: var(--ink); }
    .xl-warn { font-size: 13px; color: var(--crimson); margin: 6px 0; letter-spacing: 1px; }
    .xl-stage { border: 1px solid var(--border); padding: 8px 12px; margin: 8px 0; cursor: pointer; background: rgba(255,255,255,.4); }
    .xl-stage:hover:not(.dis) { border-color: var(--crimson); }
    .xl-stage.dis { opacity: .45; cursor: not-allowed; }
    .xl-stage-name { font-size: 16px; font-weight: bold; letter-spacing: 2px; }
    .xl-stage-desc { font-size: 12px; color: var(--ink-light); margin: 3px 0; }
    .xl-stage-rate b { color: var(--crimson); }
    .xl-confirm, .xl-result { border: 1px solid var(--crimson); padding: 10px 14px; margin-top: 10px; background: rgba(158,43,37,.04); }
    .xl-confirm-title, .xl-result-title { font-size: 16px; font-weight: bold; margin-bottom: 6px; }
    .xl-result.ok { border-color: #2b6e3f; background: rgba(43,110,63,.05); }
    .xl-result.fail { background: rgba(31,41,51,.04); }
    .xl-result-line { font-size: 14px; margin-bottom: 6px; }
    .xl-formula { font-size: 13px; color: var(--ink-light); line-height: 1.8; }
    .xl-formula b { color: var(--crimson); font-size: 15px; }
    .xl-narration { font-size: 14px; line-height: 2; margin: 8px 0; text-align: justify; }
    .xl-alloc-row { display: flex; align-items: center; gap: 10px; margin: 6px 0; font-size: 15px; }
    .xl-alloc-v { min-width: 70px; }
    .xl-alloc-btn { width: 28px; height: 28px; border: 1px solid var(--border); background: var(--paper);
      cursor: pointer; font-size: 16px; line-height: 1; }
    .xl-alloc-btn:hover:not(:disabled) { border-color: var(--crimson); color: var(--crimson); }
    .xl-alloc-btn:disabled { opacity: .35; cursor: not-allowed; }

    /* ===== M2：道身 ===== */
    .xl-char-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 16px; text-align: left; }
    .xl-attr-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 14px; }
    .xl-attr-row b { min-width: 26px; text-align: right; }
    .xl-derive { font-size: 13px; color: var(--ink-light); line-height: 1.8; }
    .xl-fate-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .xl-fate-chip { font-size: 13px; border: 1px solid var(--border); padding: 3px 10px; }
    .xl-fate-chip i { font-style: normal; font-size: 11px; color: var(--ink-light); margin-left: 4px; }
    .xl-fate-chip.tier-天 { border-color: var(--crimson); color: var(--crimson); }
    .xl-fate-chip.tier-灵 { border-color: var(--ink); }
  </style>
</head>
<body>
  <!-- Phaser 画布挂载点（演出层：战斗/地图/特效） -->
  <div id="game-root"></div>
  <!-- DOM 覆盖层根节点（一切面板/列表/文本，见架构文档 §3.1.1） -->
  <div id="dom-layer"></div>

  <!-- 技术约定：经典 script + 命名空间（window.Xuxian），禁用 ES modules，
       保证 file:// 双击直开可用；脚本顺序 = 依赖顺序（config→core→ui→scenes→main） -->
  <script src="src/assets/vendor/phaser.min.js"></script>
  <script>window.Xuxian = { config: {}, core: {}, data: { tables: {}, balance: {} }, systems: { creation: {}, cultivation: {}, stats: {} }, ui: { menus: {}, panels: {}, hud: {} }, scenes: {}, errors: [], bootOk: false };</script>
  <script src="src/config/constants.js"></script>
  <script src="src/config/gameConfig.js"></script>
  <script src="src/core/EventBus.js"></script>
  <script src="src/core/GameState.js"></script>
  <script src="src/core/SaveManager.js"></script>
  <script src="src/core/BaseScene.js"></script>
  <script src="src/core/DomLayer.js"></script>
  <script src="src/data/tables/names.js"></script>
  <script src="src/data/tables/background-fragments.js"></script>
  <script src="src/data/tables/spirit-roots.js"></script>
  <script src="src/data/tables/fate.js"></script>
  <script src="src/data/tables/intent-keywords.js"></script>
  <script src="src/systems/creation/HeartIntentParser.js"></script>
  <script src="src/systems/creation/CharacterSeeder.js"></script>
  <script src="src/systems/creation/FateDealer.js"></script>
  <script src="src/data/balance/cultivation-rates.js"></script>
  <script src="src/data/balance/breakthrough.js"></script>
  <script src="src/systems/stats/AttributeCalc.js"></script>
  <script src="src/systems/stats/RealmProgress.js"></script>
  <script src="src/systems/cultivation/CultivationState.js"></script>
  <script src="src/ui/menus/MainMenu.js"></script>
  <script src="src/ui/panels/CreationPanel.js"></script>
  <script src="src/ui/hud/StatusBar.js"></script>
  <script src="src/ui/panels/CultivationPanel.js"></script>
  <script src="src/ui/panels/CharacterPanel.js"></script>
  <script src="src/ui/panels/EchoPanel.js"></script>
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/PreloadScene.js"></script>
  <script src="src/scenes/MainMenuScene.js"></script>
  <script src="src/scenes/StoryScene.js"></script>
  <script src="src/scenes/HubScene.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
